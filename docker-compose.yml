services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      # Publica so no loopback por padrao. Exponha em 0.0.0.0 conscientemente.
      - "127.0.0.1:4447:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/app_db
      # Sem default de proposito: o app falha o boot sem JWT_SECRET em producao.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4447}
      APP_NAME: ${APP_NAME:-Projeto Profissional}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: America/Sao_Paulo
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Sem portas publicadas: acessivel apenas pela rede interna do compose.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
