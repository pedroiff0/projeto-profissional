# ==============================================================================
# Desenvolvimento — Projeto Profissional (pp-dev)
# 1 app + 1 mongo + 1 nginx
# Porta: 4429 (4430 e 4431 reservadas para PRODUÇÃO e DEMO)
# Bind mount: código local reflete no container em tempo real
# ==============================================================================
name: pp-dev

services:
  pp-mongo:
    image: mongo:7
    container_name: pp-dev-mongo
    restart: unless-stopped
    volumes:
      - pp_dev_mongo_data:/data/db
    networks: [pp_dev_network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pp-dev-app
    restart: unless-stopped
    depends_on:
      pp-mongo:
        condition: service_healthy
    volumes:
      - ./app/src:/app/app/src:ro
      - ./app/views:/app/app/views:ro
      - ./app/public:/app/app/public:ro
      - ./data:/app/data
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://pp-mongo:27017/pp_dev
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-key-projeto-profissional-2026}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-key-projeto-profissional-2026}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4429}
      APP_NAME: ${APP_NAME:-Projeto Profissional Dev}
      NO_AUTH: ${NO_AUTH:-0}
      COOKIE_SECURE: "false"
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    networks: [pp_dev_network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  pp-nginx:
    image: nginx:alpine
    container_name: pp-dev-nginx
    restart: unless-stopped
    depends_on:
      - pp-app
    ports:
      - "4429:80"
    volumes:
      - ./nginx/pp-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [pp_dev_network]

networks:
  pp_dev_network:
    name: pp_dev_network

volumes:
  pp_dev_mongo_data:
    name: pp_dev_mongo_data
