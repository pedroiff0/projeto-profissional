# Stack de TESTE / CARGA — totalmente isolada da producao.
#
#   docker compose -f docker-compose.test.yml -p pp-test up -d --build
#
# Diferencas em relacao a producao (docker-compose.yml):
#   - projeto e volumes proprios (-p pp-test): nao compartilha dados
#   - banco app_test_db num servico mongo-test separado
#   - NODE_ENV=staging e limites de taxa desativados (medir o app, nao o limiter)
#   - porta 5001 no host, para poder subir junto com a producao (5000)

name: pp-test

services:
  app-test:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      # staging, nao production: RATE_LIMIT_DISABLED e recusado em producao.
      NODE_ENV: staging
      PORT: 5000
      MONGO_URI: mongodb://mongo-test:27017/app_test_db
      JWT_SECRET: ${JWT_SECRET_TEST:-secret-de-teste-com-mais-de-32-caracteres}
      JWT_EXPIRES_IN: 2h
      APP_BASE_URL: http://localhost:5001
      COOKIE_SECURE: "false"
      # Desligado APENAS aqui: com 300 req/5min o teste mediria o limitador.
      RATE_LIMIT_DISABLED: "true"
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD_TEST:-AdminTeste123ok}
      TZ: America/Sao_Paulo
    depends_on:
      mongo-test:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongo-test:
    image: mongo:7
    # Volume anonimo: os dados de teste sao descartaveis por design.
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Executor do teste de carga. Nao sobe com `up`: use o perfil `carga`.
  #   docker compose -f docker-compose.test.yml -p pp-test \
  #     --profile carga run --rm k6 run -e PERFIL=carga /scripts/carga.js
  k6:
    image: grafana/k6:latest
    profiles: ["carga"]
    # k6 roda com UID proprio; se o HOME do usuario for 0700 (padrao em
    # varias distros) esse UID nao consegue atravessar o caminho ate o
    # bind mount e o script falha com "permission denied". Rodar como root
    # neste contêiner efemero de teste evita depender das permissoes do host.
    user: "0:0"
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/resultados:/resultados
    environment:
      BASE_URL: http://app-test:5000
      PERFIL: ${PERFIL:-carga}
      CARGA_VUS: ${CARGA_VUS:-200}
      DURACAO: ${DURACAO:-1m}
      TOTAL_USUARIOS: ${TOTAL_USUARIOS:-50}
    depends_on:
      - app-test
